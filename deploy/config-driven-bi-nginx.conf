log_format bi_access '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=bi_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bi_auth:10m rate=5r/m;
limit_req_zone $server_name zone=bi_kdf_global:10m rate=12r/m;

server {
    # Caddy is the only public entry point. Keeping this listener on loopback
    # prevents the former plain-HTTP :5178 route from bypassing login or TLS.
    listen 127.0.0.1:5178;
    server_name 187.77.129.207.nip.io;

    # Only the loopback Caddy hop is trusted to supply the original client IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    limit_req_status 429;
    error_page 429 = @bi_rate_limited;

    access_log /var/log/nginx/config-driven-bi-access.log bi_access;
    error_log /var/log/nginx/config-driven-bi-error.log warn;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-store" always;

    location @bi_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"V2_REQUEST_REJECTED","message":"请求过于频繁，请稍后重试","requestId":"$request_id"}}';
    }

    location = /api/bi/v2/auth/login {
        limit_req zone=bi_auth burst=5 nodelay;
        limit_req zone=bi_kdf_global burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/bi/admin/auth/login {
        limit_req zone=bi_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/bi/v2/auth/password {
        limit_req zone=bi_auth burst=5 nodelay;
        limit_req zone=bi_kdf_global burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/bi/v2/ {
        limit_req zone=bi_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/bi/admin/ {
        limit_req zone=bi_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/bi/health {
        limit_req zone=bi_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Legacy APIs remain available only to local migration tooling. They are
    # deliberately absent from the public allowlist so old anonymous reads and
    # the shared workspace PUT cannot bypass the V2 identity boundary.
    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
